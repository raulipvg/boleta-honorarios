services:
  postgres:
    image: postgres:17-alpine
    container_name: gestion-honorarios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in db/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in db/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in db/.env}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in db/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in db/.env}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?Set INITIAL_ADMIN_USERNAME in db/.env}
      INITIAL_ADMIN_NORMALIZED_USERNAME: ${INITIAL_ADMIN_NORMALIZED_USERNAME:?Set INITIAL_ADMIN_NORMALIZED_USERNAME in db/.env}
      INITIAL_ADMIN_PASSWORD_HASH: ${INITIAL_ADMIN_PASSWORD_HASH:?Set INITIAL_ADMIN_PASSWORD_HASH in db/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gestion-honorarios-postgres:/var/lib/postgresql/data
      - ./001_mvp_schema.sql:/bootstrap/001_mvp_schema.sql:ro
      - ./002_catalog_seed.sql:/bootstrap/002_catalog_seed.sql:ro
      - ./003_runtime_role_seed.sql:/bootstrap/003_runtime_role_seed.sql:ro
      - ./seed-inicial.sql:/bootstrap/seed-inicial.sql:ro
      - ./init/10-bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      app-net:
        aliases:
          - db
        ipv4_address: 172.30.0.2

volumes:
  gestion-honorarios-postgres:

networks:
  app-net:
    name: gestion-honorarios-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
